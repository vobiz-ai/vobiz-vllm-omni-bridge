name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - name: Mock call through the bridge (no GPU, no phone)
        run: python selftest.py --mock --port 8010 --mock-port 8791 --seconds 8

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vobiz-vllm-omni-bridge:ci
          build-args: WITH_CLOUDFLARED=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose --profile gpu --profile tunnel --profile tools config -q
      - name: Image boots and answers /health
        run: |
          docker run -d --name bridge -p 8000:8000 \
            -e PUBLIC_URL=http://127.0.0.1:8000 -e 'REALTIME_URL=ws://127.0.0.1:1/v1/realtime?duplex=1' \
            -e VOBIZ_AUTH_ID=MA_CI -e VOBIZ_AUTH_TOKEN=ci -e FROM_NUMBER=+911234567890 vobiz-vllm-omni-bridge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then echo up; break; fi; sleep 1;
          done
          curl -fsS http://127.0.0.1:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['model'], d['omni'])"
          docker logs bridge | tail -20
          docker rm -f bridge
